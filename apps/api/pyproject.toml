[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "juanpablo angarita", email = "juanpabloangarita@gmail.com" }
]
requires-python = ">=3.12.7"
dependencies = [
    "fastapi>=0.151.0",
    "google-genai>=2.31.0",
    "groq>=1.7.0",
    "openai>=3.35.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
shared = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "README.md",
]
