[project]
name = "chatbot-ui"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "juanpablo angarita", email = "juanpabloangarita@gmail.com" }
]
requires-python = ">=3.12.7"
dependencies = [
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "requests>=2.34.2",
    "streamlit>=1.66.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
shared = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot_ui"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "README.md",
]
